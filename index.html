<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Cows — Last 10 Deliveries</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #111; color: #f0f0f0; font-family: 'Segoe UI', Arial, sans-serif; padding: 0; margin: 0; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }
header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #22c55e; padding: 18px 30px; flex-shrink: 0; }
h1 { font-size: 3rem; font-weight: 700; color: #22c55e; letter-spacing: 1px; }
.date-badge { font-size: 1.4rem; background: #1e293b; padding: 10px 24px; border-radius: 10px; color: #94a3b8; }
table { width: 100%; border-collapse: collapse; font-size: 1.35rem; flex: 1; }
thead th { background: #22c55e; color: #111; font-weight: 700; padding: 14px 16px; text-align: left; text-transform: uppercase; letter-spacing: 1px; font-size: 1.15rem; }
tbody tr { border-bottom: 1px solid #2a2a2a; }
tbody tr:nth-child(even) { background: #1a1a2e; }
tbody tr:nth-child(odd) { background: #16162a; }
tbody tr:first-child td { font-weight: 700; color: #facc15; }
tbody td { padding: 13px 16px; }
.badge { display: inline-block; padding: 3px 12px; border-radius: 6px; font-size: 0.95rem; font-weight: 600; }
.badge-fr  { background: #365314; color: #a3e635; }
.badge-spr { background: #713f12; color: #fbbf24; }
.check   { color: #22c55e; font-weight: 700; }
.pending { color: #475569; }
.note { font-size: 0.85rem; color: #94a3b8; font-style: italic; }
footer { text-align: center; color: #475569; font-size: 0.9rem; padding: 8px 0; flex-shrink: 0; }
#error-msg { color: #ef4444; font-size: 0.9rem; margin-top: 4px; min-height: 1em; }
</style>
</head>
<body>
<header>
  <h1>New Cow Deliveries — Last 10</h1>
  <div>
    <div class="date-badge" id="updated">Loading...</div>
    <div id="error-msg"></div>
  </div>
</header>
<table>
  <thead>
    <tr>
      <th>Date</th><th>Qty</th><th>Status</th><th>Lact</th><th>Jockey</th>
      <th>Location</th><th>Invoice</th><th>Here</th><th>DC</th><th>Jockey #</th><th>Notes</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
<footer>Source: NewCows Google Sheet</footer>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSlfInmM32RAPJY7UhWI7Twy2ZXVdhHBVW6ebs5W5h4euS69R_cvnt0JhplidCxcDEIM7gj1N07iYrM/pub?gid=0&single=true&output=csv';
const REFRESH_MS = 5 * 60 * 1000;

function parseCSV(text) {
  const lines = text.trim().split('\n');
  // Find the header row (first row that starts with "Date")
  let headerIdx = lines.findIndex(l => l.trim().toLowerCase().startsWith('date'));
  if (headerIdx === -1) headerIdx = 0;
  const headers = lines[headerIdx].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  // Data rows come after headers, filter out blanks
  const rows = lines.slice(headerIdx + 1)
    .filter(l => l.replace(/,/g, '').trim() !== '')
    .map(line => {
      const cols = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { inQ = !inQ; }
        else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
        else { cur += c; }
      }
      cols.push(cur.trim());
      const row = {};
      headers.forEach((h, i) => row[h] = (cols[i] || '').replace(/^"|"$/g, '').trim());
      return row;
    });
  return rows;
}

function checkCell(val) {
  const v = (val || '').toLowerCase().trim();
  if (v === 'x' || v === 'yes' || v === '✓' || v === 'true' || v === 'y' || v === '1')
    return '<span class="check">✓</span>';
  return '<span class="pending">—</span>';
}

function statusBadge(val) {
  const v = (val || '').toUpperCase().trim();
  if (v === 'FR')  return '<span class="badge badge-fr">FR</span>';
  if (v === 'SPR') return '<span class="badge badge-spr">SPR</span>';
  return `<span class="badge" style="background:#1e293b;color:#94a3b8">${v||'—'}</span>`;
}

async function loadData() {
  try {
    const res = await fetch(CSV_URL + '&nocache=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text).filter(r => (r['Date'] || '').trim());

    // Sheet is newest-first after headers, take top 10
    const top10 = rows.slice(0, 10);

    document.getElementById('tbody').innerHTML = top10.map((r, i) => `
      <tr>
        <td>${r['Date'] || ''}</td>
        <td>${r['Qty'] || ''}</td>
        <td>${statusBadge(r['Status'])}</td>
        <td>${r['Lact'] || ''}</td>
        <td>${r['Jocky'] || r['Jockey'] || ''}</td>
        <td>${r['Location'] || ''}</td>
        <td>${r['Invoice'] || ''}</td>
        <td>${checkCell(r['Here'])}</td>
        <td>${checkCell(r['DC'])}</td>
        <td>${r['JOCKEY'] || r['Jockey #'] || '—'}</td>
        <td class="note">${r['Notes'] || r['notes'] || (i === 0 ? 'Most recent' : '')}</td>
      </tr>
    `).join('');

    const now = new Date();
    document.getElementById('updated').textContent =
      'Updated: ' + now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
      ' ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    document.getElementById('error-msg').textContent = '';
  } catch (err) {
    document.getElementById('error-msg').textContent = '⚠ ' + err.message;
    console.error(err);
  }
}

loadData();
setInterval(() => location.reload(), REFRESH_MS);
</script>
</body>
</html>
