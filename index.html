<style>
:root{--brand:#1f1b15;--cream:#f4e9cf;--gold:#e3a41b;--bg:#15130f;--panel:#1e1b16;--fg:#ece6d8;--muted:#a59d8e;--line:#332e25;--ok:#6cc38f;--bad:#ef5a4e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Segoe UI',Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
header{flex:0 0 auto;display:flex;align-items:center;gap:2vw;background:var(--brand);border-bottom:4px solid var(--gold);padding:1.6vh 2vw;height:12vh}
header img{height:6.4vh;width:auto;display:block}
.dv{width:2px;align-self:stretch;margin:.6vh 0;background:rgba(244,233,207,.25)}
h1{font-size:4vh;font-weight:700;color:var(--cream);letter-spacing:.08em;text-transform:uppercase;flex:1}
h1 b{color:var(--gold)}
.chip{font-size:2vh;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.8vh 1.4vw;white-space:nowrap}
.chip.err{color:var(--bad);border-color:var(--bad)}
main{flex:1;min-height:0;padding:1.6vh 2vw 1.4vh;display:flex}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);table-layout:auto}
thead th{height:5vh;background:var(--brand);color:var(--gold);font-size:1.9vh;letter-spacing:.14em;text-transform:uppercase;text-align:left;padding:0 1vw;border-bottom:2px solid var(--gold);white-space:nowrap}
tbody tr{height:7.4vh;border-bottom:1px solid var(--line)}
tbody tr:nth-child(even){background:rgba(244,233,207,.035)}
td{padding:0 1vw;font-size:2.7vh;white-space:nowrap}
td.dt{color:var(--cream);font-weight:600}
td.qty{font-weight:700;font-size:3vh}
td.note{color:var(--muted);font-style:italic;font-size:2.1vh;white-space:normal}
tr.new{background:rgba(227,164,27,.14)!important;box-shadow:inset 6px 0 0 var(--gold)}
tr.new td{color:var(--gold);font-weight:700}
tr.new td.note{color:var(--cream)}
.bd{display:inline-block;min-width:5.2vh;text-align:center;padding:.4vh 1vw;border-radius:6px;font-weight:700;font-size:2.2vh;letter-spacing:.05em}
.fr{background:rgba(108,195,143,.16);color:var(--ok);border:1px solid rgba(108,195,143,.5)}
.spr{background:rgba(227,164,27,.16);color:var(--gold);border:1px solid rgba(227,164,27,.55)}
.oth{background:var(--line);color:var(--muted)}
.ck{color:var(--ok);font-weight:800;font-size:3.2vh}
.no{color:#5d564a;font-size:3vh}
footer{flex:0 0 auto;text-align:center;color:var(--muted);font-size:1.6vh;padding:0 0 1vh;letter-spacing:.12em;text-transform:uppercase}
@media (max-width:900px){
 html,body{overflow:auto;height:auto}
 header{height:auto;flex-wrap:wrap;gap:10px;padding:12px 14px}
 header img{height:30px}.dv{display:none}
 h1{font-size:18px;flex:1 1 100%}.chip{font-size:12px}
 main{padding:10px;display:block;overflow-x:auto}
 table{min-width:900px}thead th{height:36px;font-size:12px}
 tbody tr{height:46px}td{font-size:16px}td.qty{font-size:17px}td.note{font-size:13px}.bd{font-size:14px;padding:2px 8px}.ck{font-size:18px}.no{font-size:17px}
}
</style></head><body>

else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}
else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}else cur+=c}
row.push(cur);rows.push(row);return rows}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function getRows(csv){var all=parseCSV(csv);var h=-1;for(var i=0;i<all.length;i++){if((all[i][0]||'').trim().toLowerCase()==='date'){h=i;break}}if(h<0)h=0;
var hd=all[h].map(function(x){return x.trim()});
return all.slice(h+1).filter(function(r){return r.join('').trim()!==''}).map(function(r){var o={};hd.forEach(function(k,i){o[k]=(r[i]||'').trim()});return o}).filter(function(o){return o['Date']})}
function check(v){v=(v||'').toLowerCase().trim();return['x','yes','\u2713','true','y','1'].indexOf(v)>-1?'<span class="ck">\u2713</span>':'<span class="no">\u2014</span>'}
function badge(v){v=(v||'').toUpperCase().trim();if(v==='FR')return'<span class="bd fr">FR</span>';if(v==='SPR')return'<span class="bd spr">SPR</span>';return'<span class="bd oth">'+esc(v||'\u2014')+'</span>'}
function load(){
 fetch(CSV_URL+'&nocache='+Date.now()).then(function(r){if(!r.ok)throw new Error('Sheet HTTP '+r.status);return r.text()}).then(function(t){
  var top=getRows(t).slice(0,10);
  document.getElementById('tb').innerHTML=top.map(function(r,i){var note=r['Notes']||r['notes']||(i===0?'Most recent':'');
   return '<tr'+(i===0?' class="new"':'')+'><td class="dt">'+esc(r['Date'])+'</td><td class="qty">'+esc(r['Qty'])+'</td><td>'+badge(r['Status'])+'</td><td>'+esc(r['Lact'])+'</td><td>'+esc(r['Jocky']||r['Jockey'])+'</td><td>'+esc(r['Location'])+'</td><td>'+esc(r['Invoice'])+'</td><td>'+check(r['Here'])+'</td><td>'+check(r['DC'])+'</td><td>'+esc(r['JOCKEY']||r['Jockey #']||'\u2014')+'</td><td class="note">'+esc(note)+'</td></tr>'}).join('');
  var n=new Date();var c=document.getElementById('chip');c.className='chip';
  c.textContent='Updated '+n.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+', '+n.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
 }).catch(function(e){var c=document.getElementById('chip');c.className='chip err';c.textContent='\u26A0 '+e.message})}
load();setInterval(function(){location.reload()},300000);
</script></body></html>
